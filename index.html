<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rubik's Cube Art Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:' && !window.location.pathname.includes('/dist/')) {
        document.documentElement.style.background = '#e9ece8'
        document.body.style.margin = '0'
        document.body.innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#111827;background:linear-gradient(90deg,rgba(24,33,47,.05) 1px,transparent 1px),linear-gradient(0deg,rgba(24,33,47,.05) 1px,transparent 1px),#e9ece8;background-size:28px 28px;padding:24px">
            <section style="max-width:720px;border:3px solid #111827;background:#fffdf7;box-shadow:8px 8px 0 #111827;padding:28px">
              <p style="margin:0 0 8px;color:#b91c1c;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase">Vite app</p>
              <h1 style="margin:0 0 12px;font-size:clamp(32px,7vw,60px);line-height:.95">Open this over HTTP</h1>
              <p style="font-size:18px;line-height:1.5;color:#374151">This source <code>index.html</code> cannot run directly from <code>file://</code>. Start the dev server, then open the local URL.</p>
              <pre style="white-space:pre-wrap;background:#111827;color:#fffdf7;padding:14px;border-radius:0;font-size:15px">pnpm install
pnpm dev</pre>
              <p style="font-size:16px;color:#374151">If you already ran <code>pnpm build</code>, you can also open <a style="color:#c1121f;font-weight:800" href="./dist/index.html">dist/index.html</a>.</p>
            </section>
          </main>
        `
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
